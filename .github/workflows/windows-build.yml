on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      platform-ref:
        required: true
        type: string

permissions:
  contents: read

env:
  ARCH: ${{ inputs.arch }}
  HELIUM_PLATFORM_REF: ${{ inputs['platform-ref'] }}
  HELIUM_WINDOWS_ROOT: D:\h
  HELIUM_WINDOWS_ROOT_BASH: /d/h
  GIT_AUTHOR_NAME: Helium Passwords Builder
  GIT_AUTHOR_EMAIL: builder@helium-passwords.invalid
  GIT_COMMITTER_NAME: Helium Passwords Builder
  GIT_COMMITTER_EMAIL: builder@helium-passwords.invalid

jobs:
  build-01:
    name: build_part_01
    runs-on: windows-2025
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - name: Prepare Windows platform checkout
        shell: bash
        run: |
          rm -rf "${HELIUM_WINDOWS_ROOT_BASH}"
          bash scripts/prepare-platform.sh windows "${HELIUM_WINDOWS_ROOT_BASH}"
          rm -rf .github/actions/stage
          mkdir -p .github/actions
          cp -R "${HELIUM_WINDOWS_ROOT_BASH}/.github/actions/stage" .github/actions/stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stage action dependencies
        shell: bash
        run: npm install
        working-directory: ./.github/actions/stage
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          from_artifact: false

  build-02:
    name: build_part_02
    runs-on: windows-2025
    needs: build-01
    if: ${{ needs.build-01.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: &windows_staged_steps
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - name: Prepare Windows platform checkout
        shell: bash
        run: |
          rm -rf "${HELIUM_WINDOWS_ROOT_BASH}"
          bash scripts/prepare-platform.sh windows "${HELIUM_WINDOWS_ROOT_BASH}"
          rm -rf .github/actions/stage
          mkdir -p .github/actions
          cp -R "${HELIUM_WINDOWS_ROOT_BASH}/.github/actions/stage" .github/actions/stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stage action dependencies
        shell: bash
        run: npm install
        working-directory: ./.github/actions/stage
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          from_artifact: true

