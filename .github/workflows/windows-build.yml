name: Windows staged build

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      platform-ref:
        required: true
        type: string

permissions:
  contents: read

env:
  ARCH: ${{ inputs.arch }}
  HELIUM_PLATFORM_REF: ${{ inputs['platform-ref'] }}
  HELIUM_WINDOWS_ROOT: D:\h
  HELIUM_WINDOWS_ROOT_BASH: /d/h
  GIT_AUTHOR_NAME: Helium Sync Builder
  GIT_AUTHOR_EMAIL: builder@helium-sync.invalid
  GIT_COMMITTER_NAME: Helium Sync Builder
  GIT_COMMITTER_EMAIL: builder@helium-sync.invalid

jobs:
  build-01:
    name: build_part_01
    runs-on: windows-2025
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - name: Prepare Windows platform checkout
        shell: bash
        run: |
          rm -rf "${HELIUM_WINDOWS_ROOT_BASH}"
          bash scripts/prepare-platform.sh windows "${HELIUM_WINDOWS_ROOT_BASH}"
          rm -rf .github/actions/stage
          mkdir -p .github/actions
          cp -R "${HELIUM_WINDOWS_ROOT_BASH}/.github/actions/stage" .github/actions/stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stage action dependencies
        shell: bash
        run: npm install
        working-directory: ./.github/actions/stage
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          from_artifact: false

  build-02:
    name: build_part_02
    runs-on: windows-2025
    needs: build-01
    if: ${{ needs.build-01.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: &windows_staged_steps
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - name: Prepare Windows platform checkout
        shell: bash
        run: |
          rm -rf "${HELIUM_WINDOWS_ROOT_BASH}"
          bash scripts/prepare-platform.sh windows "${HELIUM_WINDOWS_ROOT_BASH}"
          rm -rf .github/actions/stage
          mkdir -p .github/actions
          cp -R "${HELIUM_WINDOWS_ROOT_BASH}/.github/actions/stage" .github/actions/stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stage action dependencies
        shell: bash
        run: npm install
        working-directory: ./.github/actions/stage
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          from_artifact: true

  build-03:
    name: build_part_03
    runs-on: windows-2025
    needs: build-02
    if: ${{ needs.build-02.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - name: Prepare Windows platform checkout
        shell: bash
        run: |
          rm -rf "${HELIUM_WINDOWS_ROOT_BASH}"
          bash scripts/prepare-platform.sh windows "${HELIUM_WINDOWS_ROOT_BASH}"
          rm -rf .github/actions/stage
          mkdir -p .github/actions
          cp -R "${HELIUM_WINDOWS_ROOT_BASH}/.github/actions/stage" .github/actions/stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stage action dependencies
        shell: bash
        run: npm install
        working-directory: ./.github/actions/stage
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          from_artifact: true

  build-04:
    name: build_part_04
    runs-on: windows-2025
    needs: build-03
    if: ${{ needs.build-03.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - name: Prepare Windows platform checkout
        shell: bash
        run: |
          rm -rf "${HELIUM_WINDOWS_ROOT_BASH}"
          bash scripts/prepare-platform.sh windows "${HELIUM_WINDOWS_ROOT_BASH}"
          rm -rf .github/actions/stage
          mkdir -p .github/actions
          cp -R "${HELIUM_WINDOWS_ROOT_BASH}/.github/actions/stage" .github/actions/stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stage action dependencies
        shell: bash
        run: npm install
        working-directory: ./.github/actions/stage
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          from_artifact: true

  build-05:
    name: build_part_05
    runs-on: windows-2025
    needs: build-04
    if: ${{ needs.build-04.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - name: Prepare Windows platform checkout
        shell: bash
        run: |
          rm -rf "${HELIUM_WINDOWS_ROOT_BASH}"
          bash scripts/prepare-platform.sh windows "${HELIUM_WINDOWS_ROOT_BASH}"
          rm -rf .github/actions/stage
          mkdir -p .github/actions
          cp -R "${HELIUM_WINDOWS_ROOT_BASH}/.github/actions/stage" .github/actions/stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stage action dependencies
        shell: bash
        run: npm install
        working-directory: ./.github/actions/stage
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          from_artifact: true

  build-06:
    name: build_part_06
    runs-on: windows-2025
    needs: build-05
    if: ${{ needs.build-05.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - name: Prepare Windows platform checkout
        shell: bash
        run: |
          rm -rf "${HELIUM_WINDOWS_ROOT_BASH}"
          bash scripts/prepare-platform.sh windows "${HELIUM_WINDOWS_ROOT_BASH}"
          rm -rf .github/actions/stage
          mkdir -p .github/actions
          cp -R "${HELIUM_WINDOWS_ROOT_BASH}/.github/actions/stage" .github/actions/stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stage action dependencies
        shell: bash
        run: npm install
        working-directory: ./.github/actions/stage
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          from_artifact: true

  build-07:
    name: build_part_07
    runs-on: windows-2025
    needs: build-06
    if: ${{ needs.build-06.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-08:
    name: build_part_08
    runs-on: windows-2025
    needs: build-07
    if: ${{ needs.build-07.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-09:
    name: build_part_09
    runs-on: windows-2025
    needs: build-08
    if: ${{ needs.build-08.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-10:
    name: build_part_10
    runs-on: windows-2025
    needs: build-09
    if: ${{ needs.build-09.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-11:
    name: build_part_11
    runs-on: windows-2025
    needs: build-10
    if: ${{ needs.build-10.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-12:
    name: build_part_12
    runs-on: windows-2025
    needs: build-11
    if: ${{ needs.build-11.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-13:
    name: build_part_13
    runs-on: windows-2025
    needs: build-12
    if: ${{ needs.build-12.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-14:
    name: build_part_14
    runs-on: windows-2025
    needs: build-13
    if: ${{ needs.build-13.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-15:
    name: build_part_15
    runs-on: windows-2025
    needs: build-14
    if: ${{ needs.build-14.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-16:
    name: build_part_16
    runs-on: windows-2025
    needs: build-15
    if: ${{ needs.build-15.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-17:
    name: build_part_17
    runs-on: windows-2025
    needs: build-16
    if: ${{ needs.build-16.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  build-18:
    name: build_part_18
    runs-on: windows-2025
    needs: build-17
    if: ${{ needs.build-17.outputs.finished == 'false' }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps: *windows_staged_steps

  exhausted:
    name: fail if build needs more stages
    runs-on: windows-2025
    needs:
      - build-01
      - build-02
      - build-03
      - build-04
      - build-05
      - build-06
      - build-07
      - build-08
      - build-09
      - build-10
      - build-11
      - build-12
      - build-13
      - build-14
      - build-15
      - build-16
      - build-17
      - build-18
    if: ${{ always() && !cancelled() && !failure() && needs.build-18.outputs.finished == 'false' }}
    steps:
      - shell: bash
        run: |
          echo "Windows ${ARCH} build did not finish within eighteen staged jobs" >&2
          exit 1

  package:
    name: package
    runs-on: windows-2025
    needs:
      - build-01
      - build-02
      - build-03
      - build-04
      - build-05
      - build-06
      - build-07
      - build-08
      - build-09
      - build-10
      - build-11
      - build-12
      - build-13
      - build-14
      - build-15
      - build-16
      - build-17
      - build-18
    if: >-
      ${{
        always() &&
        !cancelled() &&
        !failure() &&
        (
          needs.build-01.outputs.finished == 'true' ||
          needs.build-02.outputs.finished == 'true' ||
          needs.build-03.outputs.finished == 'true' ||
          needs.build-04.outputs.finished == 'true' ||
          needs.build-05.outputs.finished == 'true' ||
          needs.build-06.outputs.finished == 'true' ||
          needs.build-07.outputs.finished == 'true' ||
          needs.build-08.outputs.finished == 'true' ||
          needs.build-09.outputs.finished == 'true' ||
          needs.build-10.outputs.finished == 'true' ||
          needs.build-11.outputs.finished == 'true' ||
          needs.build-12.outputs.finished == 'true' ||
          needs.build-13.outputs.finished == 'true' ||
          needs.build-14.outputs.finished == 'true' ||
          needs.build-15.outputs.finished == 'true' ||
          needs.build-16.outputs.finished == 'true' ||
          needs.build-17.outputs.finished == 'true' ||
          needs.build-18.outputs.finished == 'true'
        )
      }}
    steps:
      - uses: actions/checkout@v6
      - name: Save artifact collector
        shell: bash
        run: cp scripts/collect-artifacts.sh "${RUNNER_TEMP}/collect-artifacts.sh"
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force
      - name: Prepare Windows platform checkout
        shell: bash
        run: |
          rm -rf "${HELIUM_WINDOWS_ROOT_BASH}"
          bash scripts/prepare-platform.sh windows "${HELIUM_WINDOWS_ROOT_BASH}"
          rm -rf .github/actions/stage
          mkdir -p .github/actions
          cp -R "${HELIUM_WINDOWS_ROOT_BASH}/.github/actions/stage" .github/actions/stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stage action dependencies
        shell: bash
        run: npm install
        working-directory: ./.github/actions/stage
      - name: Finish build from staged artifact
        id: stage
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          from_artifact: true
      - name: Build installer and package
        uses: ./.github/actions/stage
        with:
          arm: ${{ inputs.arch == 'arm64' }}
          gen_installer: true
          from_artifact: false
      - name: Collect packaged artifacts
        shell: bash
        run: |
          bash "${RUNNER_TEMP}/collect-artifacts.sh" \
            windows \
            "${ARCH}" \
            "${HELIUM_WINDOWS_ROOT_BASH}" \
            "${GITHUB_WORKSPACE}/build/artifacts/windows-${ARCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: helium-sync-windows-${{ inputs.arch }}
          path: build/artifacts/windows-${{ inputs.arch }}/
          if-no-files-found: error
          compression-level: 0
