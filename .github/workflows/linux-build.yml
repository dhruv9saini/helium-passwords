name: Linux staged build

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      platform-ref:
        required: true
        type: string

permissions:
  contents: read

env:
  ARCH: ${{ inputs.arch }}
  HELIUM_PLATFORM_REF: ${{ inputs['platform-ref'] }}
  GIT_AUTHOR_NAME: Helium Sync Builder
  GIT_AUTHOR_EMAIL: builder@helium-sync.invalid
  GIT_COMMITTER_NAME: Helium Sync Builder
  GIT_COMMITTER_EMAIL: builder@helium-sync.invalid

jobs:
  prep:
    name: Prepare resources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Materialize Linux platform checkout
        run: bash scripts/materialize-platform-workspace.sh linux

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/build.Dockerfile
          tags: chromium-builder:trixie-slim
          outputs: type=docker,dest=/tmp/chromium-builder.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp/chromium-builder.tar
          retention-days: 1
          compression-level: 0

      - name: Load Docker image
        run: docker load -i /tmp/chromium-builder.tar

      - name: Free up runner space
        if: runner.environment == 'github-hosted'
        run: bash ./.github/scripts/cleanup.sh

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Prepare build tree
        env:
          _prepare_only: true
          _use_existing_image: true
          _gha_final: false
          _runner_environment: ${{ runner.environment }}
        run: bash ./scripts/docker-build.sh

      - name: Export build cache
        run: bash ./.github/scripts/export-cache.sh

      - name: Upload build cache
        uses: actions/upload-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/build-cache-${{ inputs.arch }}.tar.zst
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  build-part-01:
    name: build_part_01
    runs-on: ubuntu-24.04
    needs: prep
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/materialize-platform-workspace.sh linux
      - uses: actions/download-artifact@v7
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp
      - run: docker load -i /tmp/chromium-builder.tar
      - if: runner.environment == 'github-hosted'
        run: bash ./.github/scripts/cleanup.sh
      - uses: actions/download-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/
      - run: bash ./.github/scripts/import-cache.sh
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build
        id: build
        env:
          _prepare_only: false
          _use_existing_image: true
          _gha_final: false
          _runner_environment: ${{ runner.environment }}
        run: bash ./scripts/docker-build.sh
      - run: bash ./.github/scripts/export-cache.sh
      - uses: actions/upload-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/build-cache-${{ inputs.arch }}.tar.zst
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  build-part-02:
    name: build_part_02
    runs-on: ubuntu-24.04
    needs: build-part-01
    if: ${{ needs.build-part-01.outputs.status == 'running' }}
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/materialize-platform-workspace.sh linux
      - uses: actions/download-artifact@v7
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp
      - run: docker load -i /tmp/chromium-builder.tar
      - if: runner.environment == 'github-hosted'
        run: bash ./.github/scripts/cleanup.sh
      - uses: actions/download-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/
      - run: bash ./.github/scripts/import-cache.sh
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build
        id: build
        env:
          _prepare_only: false
          _use_existing_image: true
          _gha_final: false
          _runner_environment: ${{ runner.environment }}
        run: bash ./scripts/docker-build.sh
      - run: bash ./.github/scripts/export-cache.sh
      - uses: actions/upload-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/build-cache-${{ inputs.arch }}.tar.zst
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  build-part-03:
    name: build_part_03
    runs-on: ubuntu-24.04
    needs: build-part-02
    if: ${{ needs.build-part-02.outputs.status == 'running' }}
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/materialize-platform-workspace.sh linux
      - uses: actions/download-artifact@v7
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp
      - run: docker load -i /tmp/chromium-builder.tar
      - if: runner.environment == 'github-hosted'
        run: bash ./.github/scripts/cleanup.sh
      - uses: actions/download-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/
      - run: bash ./.github/scripts/import-cache.sh
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build
        id: build
        env:
          _prepare_only: false
          _use_existing_image: true
          _gha_final: false
          _runner_environment: ${{ runner.environment }}
        run: bash ./scripts/docker-build.sh
      - run: bash ./.github/scripts/export-cache.sh
      - uses: actions/upload-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/build-cache-${{ inputs.arch }}.tar.zst
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  build-part-04:
    name: build_part_04
    runs-on: ubuntu-24.04
    needs: build-part-03
    if: ${{ needs.build-part-03.outputs.status == 'running' }}
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/materialize-platform-workspace.sh linux
      - uses: actions/download-artifact@v7
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp
      - run: docker load -i /tmp/chromium-builder.tar
      - if: runner.environment == 'github-hosted'
        run: bash ./.github/scripts/cleanup.sh
      - uses: actions/download-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/
      - run: bash ./.github/scripts/import-cache.sh
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build
        id: build
        env:
          _prepare_only: false
          _use_existing_image: true
          _gha_final: false
          _runner_environment: ${{ runner.environment }}
        run: bash ./scripts/docker-build.sh
      - run: bash ./.github/scripts/export-cache.sh
      - uses: actions/upload-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/build-cache-${{ inputs.arch }}.tar.zst
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  build-part-05:
    name: build_part_05
    runs-on: ubuntu-24.04
    needs: build-part-04
    if: ${{ needs.build-part-04.outputs.status == 'running' }}
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/materialize-platform-workspace.sh linux
      - uses: actions/download-artifact@v7
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp
      - run: docker load -i /tmp/chromium-builder.tar
      - if: runner.environment == 'github-hosted'
        run: bash ./.github/scripts/cleanup.sh
      - uses: actions/download-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/
      - run: bash ./.github/scripts/import-cache.sh
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build
        id: build
        env:
          _prepare_only: false
          _use_existing_image: true
          _gha_final: false
          _runner_environment: ${{ runner.environment }}
        run: bash ./scripts/docker-build.sh
      - run: bash ./.github/scripts/export-cache.sh
      - uses: actions/upload-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/build-cache-${{ inputs.arch }}.tar.zst
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  build-part-06:
    name: build_part_06
    runs-on: ubuntu-24.04
    needs: build-part-05
    if: ${{ needs.build-part-05.outputs.status == 'running' }}
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/materialize-platform-workspace.sh linux
      - uses: actions/download-artifact@v7
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp
      - run: docker load -i /tmp/chromium-builder.tar
      - if: runner.environment == 'github-hosted'
        run: bash ./.github/scripts/cleanup.sh
      - uses: actions/download-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/
      - run: bash ./.github/scripts/import-cache.sh
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build
        env:
          _prepare_only: false
          _use_existing_image: true
          _gha_final: true
          _runner_environment: ${{ runner.environment }}
        run: bash ./scripts/docker-build.sh
      - run: bash ./.github/scripts/export-cache.sh
      - uses: actions/upload-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/build-cache-${{ inputs.arch }}.tar.zst
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  package:
    name: package
    runs-on: ubuntu-24.04
    needs: build-part-06
    if: ${{ always() && !cancelled() && !failure() && contains(fromJSON('["success", "skipped"]'), needs.build-part-06.result) }}
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/materialize-platform-workspace.sh linux
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v7
        with:
          name: build-cache-${{ inputs.arch }}
          path: .github/cache/
      - run: bash ./.github/scripts/import-cache.sh
      - name: Package
        env:
          MAKE_DEB: 1
        run: bash ./package/docker-package.sh
      - name: Collect packaged artifacts
        run: |
          output_dir="build/artifacts/linux-${ARCH}"
          rm -rf "${output_dir}"
          mkdir -p "${output_dir}"

          shopt -s nullglob
          artifacts=(
            build/release/*.AppImage
            build/release/*.AppImage.zsync
            build/release/*.tar.xz
            build/release/*.tar.xz.asc
            build/release/*.deb
          )
          shopt -u nullglob

          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "no packaged Linux artifacts found" >&2
            exit 1
          fi

          cp -v "${artifacts[@]}" "${output_dir}/"
          version="$(
            python3 helium-chromium/utils/helium_version.py \
              --tree helium-chromium \
              --platform-tree . \
              --print
          )"
          {
            printf 'version=%s\n' "${version}"
            printf 'platform=linux\n'
            printf 'arch=%s\n' "${ARCH}"
            cat .helium-platform-source.env
          } > "${output_dir}/manifest.env"
          printf '%s\n' "${version}" > "${output_dir}/version.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: helium-passwords-linux-${{ inputs.arch }}
          path: build/artifacts/linux-${{ inputs.arch }}/
          if-no-files-found: error
          compression-level: 0
