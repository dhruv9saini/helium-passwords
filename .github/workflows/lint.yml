name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check shell scripts
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts -name '*.sh' -type f | sort)

      - name: Validate patch metadata
        run: ./helium-chromium/devutils/lint.py -t .

      - name: Replay password restoration on pinned Chromium source
        run: bash scripts/check-password-patch-stack.sh

      - name: Smoke-test overlay injection
        shell: bash
        run: |
          checkout="$(bash scripts/prepare-platform.sh --skip-submodules linux /tmp/helium-passwords-linux-smoke)"
          grep -qx 'helium/passwords/restore-password-autofill.patch' "$checkout/patches/series"
          grep -qx 'helium/passwords/restore-password-ui.patch' "$checkout/patches/series"
          grep -qx 'helium/sync/0001-helium-sync-overlay-files.patch' "$checkout/patches/series"
          grep -qx 'helium/sync/0002-helium-sync-profile-service.patch' "$checkout/patches/series"
          test -f "$checkout/patches/helium/passwords/restore-password-autofill.patch"
          test -f "$checkout/patches/helium/sync/0001-helium-sync-overlay-files.patch"
