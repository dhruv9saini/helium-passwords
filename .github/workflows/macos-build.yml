name: macOS staged build

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform-ref:
        required: true
        type: string
    secrets:
      PROD_MACOS_CERTIFICATE:
        required: false
      PROD_MACOS_CERTIFICATE_PWD:
        required: false
      PROD_MACOS_CERTIFICATE_NAME:
        required: false
      PROD_MACOS_CI_KEYCHAIN_PWD:
        required: false
      PROD_MACOS_NOTARIZATION_APPLE_ID:
        required: false
      PROD_MACOS_NOTARIZATION_TEAM_ID:
        required: false
      PROD_MACOS_NOTARIZATION_PWD:
        required: false
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64:
        required: false
      PROD_MACOS_SPARKLE_ED_PUB_KEY:
        required: false

permissions:
  contents: read

env:
  ARCH: ${{ inputs.arch }}
  HELIUM_PLATFORM_REF: ${{ inputs['platform-ref'] }}

jobs:
  resources:
    name: Retrieve resources
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: cp scripts/gha-macos-stage.sh "${RUNNER_TEMP}/gha-macos-stage.sh"
      - run: bash scripts/materialize-platform-workspace.sh macos
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download and pack resources
        run: bash "${RUNNER_TEMP}/gha-macos-stage.sh" prepare-resources "${ARCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: helium_macos_resources_${{ inputs.arch }}
          path: upload_build_resources/
          if-no-files-found: error
          compression-level: 0

  build-01:
    name: build_job_01
    runs-on: ${{ inputs.runner }}
    needs: resources
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: cp scripts/gha-macos-stage.sh "${RUNNER_TEMP}/gha-macos-stage.sh"
      - run: bash scripts/materialize-platform-workspace.sh macos
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: helium_macos_resources_${{ inputs.arch }}
      - name: Build
        id: stage
        env:
          PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
        run: bash "${RUNNER_TEMP}/gha-macos-stage.sh" build-init "${ARCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
          path: upload_part_build/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
          path: upload_logs/
          if-no-files-found: error
          overwrite: true
      - if: steps.stage.outputs.status == 'finished'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.file_name }}
          path: |
            release_asset/
            ${{ steps.stage.outputs.file_name }}.hashes.md
          if-no-files-found: error
          compression-level: 0

  build-02:
    name: build_job_02
    runs-on: ${{ inputs.runner }}
    needs: build-01
    if: ${{ needs.build-01.outputs.status == 'running' }}
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: cp scripts/gha-macos-stage.sh "${RUNNER_TEMP}/gha-macos-stage.sh"
      - run: bash scripts/materialize-platform-workspace.sh macos
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
      - uses: actions/download-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
      - name: Build
        id: stage
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
        run: bash "${RUNNER_TEMP}/gha-macos-stage.sh" build-resume "${ARCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
          path: upload_part_build/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
          path: upload_logs/
          if-no-files-found: error
          overwrite: true
      - if: steps.stage.outputs.status == 'finished'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.file_name }}
          path: |
            release_asset/
            ${{ steps.stage.outputs.file_name }}.hashes.md
          if-no-files-found: error
          compression-level: 0

  build-03:
    name: build_job_03
    runs-on: ${{ inputs.runner }}
    needs: build-02
    if: ${{ needs.build-02.outputs.status == 'running' }}
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: cp scripts/gha-macos-stage.sh "${RUNNER_TEMP}/gha-macos-stage.sh"
      - run: bash scripts/materialize-platform-workspace.sh macos
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
      - uses: actions/download-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
      - name: Build
        id: stage
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
        run: bash "${RUNNER_TEMP}/gha-macos-stage.sh" build-resume "${ARCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
          path: upload_part_build/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
          path: upload_logs/
          if-no-files-found: error
          overwrite: true
      - if: steps.stage.outputs.status == 'finished'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.file_name }}
          path: |
            release_asset/
            ${{ steps.stage.outputs.file_name }}.hashes.md
          if-no-files-found: error
          compression-level: 0

  build-04:
    name: build_job_04
    runs-on: ${{ inputs.runner }}
    needs: build-03
    if: ${{ needs.build-03.outputs.status == 'running' }}
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: cp scripts/gha-macos-stage.sh "${RUNNER_TEMP}/gha-macos-stage.sh"
      - run: bash scripts/materialize-platform-workspace.sh macos
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
      - uses: actions/download-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
      - name: Build
        id: stage
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
        run: bash "${RUNNER_TEMP}/gha-macos-stage.sh" build-resume "${ARCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
          path: upload_part_build/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
          path: upload_logs/
          if-no-files-found: error
          overwrite: true
      - if: steps.stage.outputs.status == 'finished'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.file_name }}
          path: |
            release_asset/
            ${{ steps.stage.outputs.file_name }}.hashes.md
          if-no-files-found: error
          compression-level: 0

  build-05:
    name: build_job_05
    runs-on: ${{ inputs.runner }}
    needs: build-04
    if: ${{ needs.build-04.outputs.status == 'running' }}
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: cp scripts/gha-macos-stage.sh "${RUNNER_TEMP}/gha-macos-stage.sh"
      - run: bash scripts/materialize-platform-workspace.sh macos
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
      - uses: actions/download-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
      - name: Build
        id: stage
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
        run: bash "${RUNNER_TEMP}/gha-macos-stage.sh" build-resume "${ARCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
          path: upload_part_build/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
          path: upload_logs/
          if-no-files-found: error
          overwrite: true
      - if: steps.stage.outputs.status == 'finished'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.file_name }}
          path: |
            release_asset/
            ${{ steps.stage.outputs.file_name }}.hashes.md
          if-no-files-found: error
          compression-level: 0

  build-06:
    name: build_job_06
    runs-on: ${{ inputs.runner }}
    needs: build-05
    if: ${{ needs.build-05.outputs.status == 'running' }}
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v6
      - run: cp scripts/gha-macos-stage.sh "${RUNNER_TEMP}/gha-macos-stage.sh"
      - run: bash scripts/materialize-platform-workspace.sh macos
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
      - uses: actions/download-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
      - name: Build
        id: stage
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
        run: bash "${RUNNER_TEMP}/gha-macos-stage.sh" build-resume "${ARCH}"
      - if: steps.stage.outputs.status != 'finished'
        run: |
          echo "macOS build did not finish after the final staged job" >&2
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_artifact_${{ inputs.arch }}
          path: upload_part_build/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: github_build_logs_${{ inputs.arch }}
          path: upload_logs/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.file_name }}
          path: |
            release_asset/
            ${{ steps.stage.outputs.file_name }}.hashes.md
          if-no-files-found: error
          compression-level: 0

  collect:
    name: collect
    runs-on: ${{ inputs.runner }}
    needs: build-06
    if: ${{ always() && !cancelled() && !failure() && contains(fromJSON('["success", "skipped"]'), needs.build-06.result) }}
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/materialize-platform-workspace.sh macos
      - id: version
        run: |
          version="$(
            python3 helium-chromium/utils/helium_version.py \
              --tree helium-chromium \
              --platform-tree . \
              --print
          )"
          file_name="helium_${version}_${ARCH}-macos.dmg"
          {
            printf 'version=%s\n' "${version}"
            printf 'file_name=%s\n' "${file_name}"
          } >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@v7
        with:
          name: ${{ steps.version.outputs.file_name }}
          path: macos-release
      - name: Collect packaged artifacts
        run: |
          output_dir="build/artifacts/macos-${ARCH}"
          rm -rf "${output_dir}"
          mkdir -p "${output_dir}"
          find macos-release -type f -print -exec cp -v {} "${output_dir}/" \;
          {
            printf 'version=%s\n' "${{ steps.version.outputs.version }}"
            printf 'platform=macos\n'
            printf 'arch=%s\n' "${ARCH}"
          } > "${output_dir}/manifest.env"
          printf '%s\n' "${{ steps.version.outputs.version }}" > "${output_dir}/version.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: helium-passwords-macos-${{ inputs.arch }}
          path: build/artifacts/macos-${{ inputs.arch }}/
          if-no-files-found: error
          compression-level: 0
