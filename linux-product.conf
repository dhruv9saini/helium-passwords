# Linux artifact identity. Callers still pass product, architecture, target,
# and build job explicitly; the resolver requires those inputs to match this
# repository binding.

HELIUM_LINUX_PRODUCT=helium-passwords
HELIUM_LINUX_PASSWORDS_REF=HEAD
HELIUM_LINUX_SYNC_REF=0000000000000000000000000000000000000000
HELIUM_LINUX_X86_64_TARGET=linux-x86_64
HELIUM_LINUX_ARM64_TARGET=linux-arm64
